# CI for bevy_gooey.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (standalone) + test
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # A plain `cargo build` takes no dev-dependencies, so it compiles exactly the trimmed Bevy
      # features a consumer gets; the full `bevy` dev-dependency would hide a hole in the list.
      - name: Build with only the declared features
        run: cargo build

      # Includes tests/leaf.rs (the boundary ratchet), tests/skin.rs, tests/nav.rs (every file in tests/ is a module of the one `all` binary) and the doctests.
      - name: Test
        run: cargo test

      - name: Test (serde)
        run: cargo test --features serde

      - name: Test (readme)
        run: cargo test --features readme-example --test all readme::

      # The examples need a window at run time, not build time, so building them is the check that
      # fits in CI.
      - name: Build examples
        run: cargo build --examples

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
